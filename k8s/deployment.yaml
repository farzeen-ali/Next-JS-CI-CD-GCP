apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nextjs-app
  
  template:
    metadata:
      labels:
        app: nextjs-app
      
    spec:
      containers:
        - name: nextjs

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 3000
          resources:
              requests:
                cpu: "250m"
                memory: "256Mi"

              limits:
                cpu: "500m"
                memory: "512Mi"
